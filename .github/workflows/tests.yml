name: Python tests

on:
  push:
    branches: [main, exp/rsi-anything]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,rsi]'
      - run: python -m pytest tests/ -q
      - run: python -m evolution.skills.compare_optimizers --help
      - run: python scripts/check_rsi_public.py --aggregates reports/rsi-self-evolution-v0

  original-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0a929e3aa20e15cf04dc7c28492a7d41a5139125
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/ -q
